<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumen Semanal de Hábitos</title>
  <style>
    :root {
      --bg-page: #ffffff;
      --card-bg: #ffffff;
      --card-border: #f0e6e3;
      --item-bg: #faf6f5;
      --item-border: #f2e9e6;
      --primary: #865d52;
      --primary-dark: #5e3f37;
      --primary-light: #ab7f74;
      --text-main: #5e3f37;
      --text-stat: #865d52;
      --bar-bg: #ebdcd8;
      --bar-fill: linear-gradient(90deg, #ab7f74, #865d52);
      --bar-complete: #5e3f37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .habit-widget {
      container-type: inline-size;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: clamp(8px, 2.8cqi, 12px);
      width: 100%;
      max-width: 100%;
    }

    .habit-card {
      background: var(--item-bg);
      border: 1px solid var(--item-border);
      border-radius: 10px;
      padding: clamp(8px, 2.5cqi, 10px);
      margin-bottom: clamp(6px, 2cqi, 8px);
      overflow: hidden;
    }

    .habit-card:last-child {
      margin-bottom: 0;
    }

    .habit-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: clamp(5px, 1.8cqi, 7px);
      gap: 6px;
    }

    .title-wrapper {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow: hidden;
    }

    .habit-title {
      font-size: clamp(0.78rem, 4.4cqi, 0.92rem);
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Animación del icono de confeti */
    .confetti-badge {
      display: none;
      font-size: clamp(0.75rem, 3.8cqi, 0.9rem);
      animation: popConfetti 0.5s ease-out forwards, floatAnim 2s ease-in-out infinite alternate;
    }

    .confetti-badge.show {
      display: inline-block;
    }

    @keyframes popConfetti {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes floatAnim {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-2px) rotate(8deg); }
    }

    .habit-stat {
      font-size: clamp(0.68rem, 3.6cqi, 0.8rem);
      font-weight: 600;
      color: var(--text-stat);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .progress-track {
      background: var(--bar-bg);
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      background: var(--bar-fill);
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.5s ease;
    }

    .progress-fill.completed {
      background: var(--bar-complete);
    }
  </style>
</head>
<body>

  <div class="habit-widget">
    <div id="habits-list"></div>
  </div>

  <script>
    const CLOUDFLARE_WORKER_URL = "https://habittracker.albaadamerojas.workers.dev/";

    const habitsConfig = [
      { key: "comerSano", name: "Comer sano", target: 6 },
      { key: "leer", name: "Leer", target: 4 },
      { key: "agua", name: "2 L agua", target: 7 },
      { key: "pasos", name: "Pasos", target: 5 }
    ];

    const container = document.getElementById("habits-list");

    function renderInitial() {
      container.innerHTML = "";
      habitsConfig.forEach(habit => {
        const card = document.createElement("div");
        card.className = "habit-card";
        card.innerHTML = `
          <div class="habit-top">
            <div class="title-wrapper">
              <span class="habit-title">${habit.name}</span>
              <span class="confetti-badge" id="confetti_${habit.key}">🎉</span>
            </div>
            <span class="habit-stat" id="stat_${habit.key}">- / ${habit.target} d</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="bar_${habit.key}" style="width: 0%;"></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateUI(data) {
      habitsConfig.forEach(habit => {
        const count = data[habit.key] !== undefined ? data[habit.key] : 0;
        const percent = Math.min(100, Math.round((count / habit.target) * 100));

        const statEl = document.getElementById(`stat_${habit.key}`);
        const barEl = document.getElementById(`bar_${habit.key}`);
        const confettiEl = document.getElementById(`confetti_${habit.key}`);

        if (statEl && barEl) {
          statEl.textContent = `${count} / ${habit.target} d (${percent}%)`;
          barEl.style.width = `${percent}%`;

          if (count >= habit.target) {
            barEl.classList.add("completed");
            if (confettiEl) confettiEl.classList.add("show");
          } else {
            barEl.classList.remove("completed");
            if (confettiEl) confettiEl.classList.remove("show");
          }
        }
      });
    }

    async function fetchNotionHabits() {
      try {
        const response = await fetch(CLOUDFLARE_WORKER_URL);
        if (!response.ok) throw new Error("Error en la respuesta del Worker");
        const data = await response.json();
        updateUI(data);
      } catch (error) {
        console.error("Error al cargar hábitos desde Notion:", error);
      }
    }

    renderInitial();
    fetchNotionHabits();
  </script>
</body>
</html>
