<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objetivos Semana</title>
  <style>
    :root {
      --text-category: #84634B;
      --btn-border: #DCD6CD;
      --btn-text: #634E3E;
      --btn-hover: #F8F5F1;
      --placeholder-color: #B5AFA7;
      --text-task: #4A3E36;
      --check-border: #84634B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent;
      padding: 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: flex-start;
    }

    .widget-container {
      width: 100%;
      max-width: 320px;
    }

    /* Botón Nueva Semana */
    .btn-new-week {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFFFFF;
      border: 1px solid var(--btn-border);
      border-radius: 6px;
      padding: 4px 10px;
      font-family: Lyon-Text, Georgia, "Times New Roman", serif;
      font-size: 0.85rem;
      color: var(--btn-text);
      cursor: pointer;
      margin-bottom: 14px;
      transition: all 0.15s ease;
    }

    .btn-new-week:hover {
      background-color: var(--btn-hover);
      border-color: #C8BDB2;
    }

    .btn-new-week span {
      font-size: 1rem;
      line-height: 1;
      font-weight: bold;
    }

    /* Secciones Desplegables */
    details {
      margin-bottom: 10px;
    }

    summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: Lyon-Text, Georgia, "Times New Roman", serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-category);
      user-select: none;
      outline: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary .arrow {
      font-size: 0.6rem;
      transition: transform 0.15s ease;
      display: inline-block;
    }

    details[open] summary .arrow {
      transform: rotate(90deg);
    }

    /* Lista de tareas */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px 0 2px 16px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Casilla de verificación */
    .checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border: 1.5px solid var(--check-border);
      border-radius: 3px;
      background-color: #FFFFFF;
      cursor: pointer;
      display: grid;
      place-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .checkbox:checked {
      background-color: var(--check-border);
    }

    .checkbox:checked::after {
      content: '';
      width: 3px;
      height: 7px;
      border: solid #FFFFFF;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-0.5px, -1px);
    }

    /* Input de texto */
    .task-input {
      border: none;
      outline: none;
      background: transparent;
      font-family: Lyon-Text, Georgia, "Times New Roman", serif;
      font-size: 0.88rem;
      color: var(--text-task);
      width: 100%;
    }

    .task-input::placeholder {
      color: var(--placeholder-color);
      font-family: Lyon-Text, Georgia, "Times New Roman", serif;
    }

    .task-input.completed {
      text-decoration: line-through;
      color: var(--placeholder-color);
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <button class="btn-new-week" onclick="nuevaSemana()">
      <span>+</span> Nueva semana
    </button>

    <!-- Sección Estudiar -->
    <details open>
      <summary><span class="arrow">▶</span> Estudiar</summary>
      <div class="task-list" id="list-estudiar"></div>
    </details>

    <!-- Sección Personal -->
    <details open>
      <summary><span class="arrow">▶</span> Personal</summary>
      <div class="task-list" id="list-personal"></div>
    </details>
  </div>

  <script>
    function createTaskElement() {
      const item = document.createElement('div');
      item.className = 'task-item';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'checkbox';
      checkbox.onchange = function() {
        if (this.checked) {
          input.classList.add('completed');
        } else {
          input.classList.remove('completed');
        }
      };

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'task-input';
      input.placeholder = 'Tareas pendientes';

      input.addEventListener('keydown', function(e) {
        const list = item.parentElement;

        // Enter: Crea y enfoca la siguiente tarea
        if (e.key === 'Enter') {
          e.preventDefault();
          const { item: newItem, input: nextInput } = createTaskElement();
          item.after(newItem);
          nextInput.focus();
        }

        // Backspace en campo vacío: Borra la fila si no es la única
        if (e.key === 'Backspace' && input.value === '' && list.children.length > 1) {
          e.preventDefault();
          const prevItem = item.previousElementSibling || item.nextElementSibling;
          item.remove();
          if (prevItem) {
            const prevInput = prevItem.querySelector('.task-input');
            if (prevInput) prevInput.focus();
          }
        }
      });

      item.appendChild(checkbox);
      item.appendChild(input);
      return { item, input };
    }

    function addTask(containerId) {
      const container = document.getElementById(containerId);
      const { item, input } = createTaskElement();
      container.appendChild(item);
      return input;
    }

    function nuevaSemana() {
      const listEstudiar = document.getElementById('list-estudiar');
      const listPersonal = document.getElementById('list-personal');

      listEstudiar.innerHTML = '';
      listPersonal.innerHTML = '';

      addTask('list-estudiar');
      addTask('list-personal');
    }

    // Iniciar con una casilla por sección
    nuevaSemana();
  </script>
</body>
</html>
