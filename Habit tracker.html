<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget de Hábitos</title>
  <style>
    :root {
      --bg-page: #ffffff;
      --card-bg: #ffffff;
      --card-border: #f0e6e3;
      --item-bg: #faf6f5;
      --item-border: #f2e9e6;
      --primary: #865d52;
      --primary-dark: #5e3f37;
      --primary-light: #ab7f74;
      --circle-inactive: #f2e9e6;
      --circle-inactive-text: #865d52;
      --text-main: #5e3f37;
      --text-stat: #865d52;
      --bar-bg: #ebdcd8;
      --bar-fill: linear-gradient(90deg, #ab7f74, #865d52);
      --bar-complete: #5e3f37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    /* Contenedor compacto */
    .habit-widget {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.1rem;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 4px 20px rgba(134, 93, 82, 0.08);
    }

    /* Filas de hábitos */
    .habit-card {
      background: var(--item-bg);
      border: 1px solid var(--item-border);
      border-radius: 14px;
      padding: 0.7rem 0.8rem;
      margin-bottom: 0.6rem;
    }

    .habit-card:last-child {
      margin-bottom: 0;
    }

    .habit-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
    }

    .habit-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .habit-stat {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-stat);
    }

    /* Días circulares */
    .days-row {
      display: flex;
      justify-content: space-between;
      gap: 0.25rem;
      margin-bottom: 0.55rem;
    }

    .day-item {
      display: none;
    }

    .day-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--circle-inactive);
      color: var(--circle-inactive-text);
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .day-circle:hover {
      transform: scale(1.08);
      background: #ebdcd8;
    }

    .day-item:checked + .day-circle {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(134, 93, 82, 0.35);
      transform: scale(1.05);
    }

    /* Barra de progreso */
    .progress-track {
      background: var(--bar-bg);
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      background: var(--bar-fill);
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-fill.completed {
      background: var(--bar-complete);
    }

    /* Botón inferior */
    .footer-action {
      display: flex;
      justify-content: center;
      margin-top: 0.9rem;
    }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--primary-light);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="habit-widget">
    <div id="habits-list"></div>

    <div class="footer-action">
      <button class="btn-reset" onclick="resetWeek()">Reiniciar semana</button>
    </div>
  </div>

  <script>
    const habitsData = [
      { id: "leer", name: "Leer 20 min", target: 5 },
      { id: "comer", name: "Comer sano", target: 6 },
      { id: "ejercicio", name: "Ejercicio", target: 5 },
      { id: "agua", name: "2 L agua", target: 7 }
    ];

    const days = ["L", "M", "X", "J", "V", "S", "D"];
    const container = document.getElementById("habits-list");

    function getStoredData() {
      const saved = localStorage.getItem("weekly_habits_tracker");
      return saved ? JSON.parse(saved) : {};
    }

    function saveState(state) {
      localStorage.setItem("weekly_habits_tracker", JSON.stringify(state));
    }

    function renderWidget() {
      const state = getStoredData();
      container.innerHTML = "";

      habitsData.forEach((habit) => {
        const habitChecked = state[habit.id] || [];
        const count = habitChecked.length;
        const percent = Math.min(100, Math.round((count / habit.target) * 100));

        const card = document.createElement("div");
        card.className = "habit-card";

        const daysHtml = days.map((day, dIdx) => {
          const isChecked = habitChecked.includes(dIdx) ? "checked" : "";
          return `
            <label>
              <input type="checkbox" class="day-item" id="chk_${habit.id}_${dIdx}" 
                     ${isChecked} onchange="toggleDay('${habit.id}', ${dIdx})">
              <span class="day-circle">${day}</span>
            </label>
          `;
        }).join("");

        const isCompletedClass = count >= habit.target ? "completed" : "";

        card.innerHTML = `
          <div class="habit-top">
            <span class="habit-title">${habit.name}</span>
            <span class="habit-stat" id="stat_${habit.id}">${count}/${habit.target} días (${percent}%)</span>
          </div>
          <div class="days-row">${daysHtml}</div>
          <div class="progress-track">
            <div class="progress-fill ${isCompletedClass}" id="bar_${habit.id}" style="width: ${percent}%;"></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleDay(habitId, dayIndex) {
      const state = getStoredData();
      if (!state[habitId]) state[habitId] = [];

      const index = state[habitId].indexOf(dayIndex);
      if (index === -1) {
        state[habitId].push(dayIndex);
      } else {
        state[habitId].splice(index, 1);
      }

      saveState(state);

      const habit = habitsData.find(h => h.id === habitId);
      const count = state[habitId].length;
      const percent = Math.min(100, Math.round((count / habit.target) * 100));

      const bar = document.getElementById(`bar_${habitId}`);
      const stat = document.getElementById(`stat_${habitId}`);

      stat.textContent = `${count}/${habit.target} días (${percent}%)`;
      bar.style.width = `${percent}%`;

      if (count >= habit.target) {
        bar.classList.add("completed");
      } else {
        bar.classList.remove("completed");
      }
    }

    function resetWeek() {
      if (confirm("¿Deseas reiniciar las casillas de toda la semana?")) {
        localStorage.removeItem("weekly_habits_tracker");
        renderWidget();
      }
    }

    renderWidget();
  </script>
</body>
</html>
