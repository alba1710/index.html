<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget de Hábitos</title>
  <style>
    :root {
      --bg-page: #ffffff;
      --card-bg: #ffffff;
      --card-border: #f0e6e3;
      --item-bg: #faf6f5;
      --item-border: #f2e9e6;
      --primary: #865d52;
      --primary-dark: #5e3f37;
      --primary-light: #ab7f74;
      --circle-inactive: #f2e9e6;
      --circle-inactive-text: #865d52;
      --text-main: #5e3f37;
      --text-stat: #865d52;
      --bar-bg: #ebdcd8;
      --bar-fill: linear-gradient(90deg, #ab7f74, #865d52);
      --bar-complete: #5e3f37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Contenedor fluido con soporte para Container Queries */
    .habit-widget {
      container-type: inline-size;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: clamp(6px, 2.5cqi, 12px);
      width: 100%;
      max-width: 100%;
    }

    /* Filas de hábitos */
    .habit-card {
      background: var(--item-bg);
      border: 1px solid var(--item-border);
      border-radius: 10px;
      padding: clamp(5px, 2cqi, 8px);
      margin-bottom: clamp(4px, 1.5cqi, 6px);
      overflow: hidden;
    }

    .habit-card:last-child {
      margin-bottom: 0;
    }

    .habit-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: clamp(3px, 1.2cqi, 5px);
      gap: 4px;
    }

    .habit-title {
      font-size: clamp(0.65rem, 3.8cqi, 0.8rem);
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .habit-stat {
      font-size: clamp(0.58rem, 3.2cqi, 0.7rem);
      font-weight: 600;
      color: var(--text-stat);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Cuadrícula de 7 columnas exactas: jamás se sale del recuadro */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(2px, 1cqi, 4px);
      margin-bottom: clamp(3px, 1.2cqi, 6px);
      width: 100%;
    }

    .day-item {
      display: none;
    }

    .day-label {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .day-circle {
      width: 100%;
      max-width: 26px;
      aspect-ratio: 1 / 1; /* Círculo perfecto automático */
      border-radius: 50%;
      background: var(--circle-inactive);
      color: var(--circle-inactive-text);
      font-size: clamp(0.55rem, 3.3cqi, 0.7rem);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .day-circle:hover {
      background: #ebdcd8;
    }

    .day-item:checked + .day-circle {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 1px 4px rgba(134, 93, 82, 0.35);
    }

    /* Barra de progreso */
    .progress-track {
      background: var(--bar-bg);
      height: 4px;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      background: var(--bar-fill);
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .progress-fill.completed {
      background: var(--bar-complete);
    }

    /* Botón inferior */
    .footer-action {
      display: flex;
      justify-content: center;
      margin-top: clamp(6px, 2cqi, 10px);
    }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--primary-light);
      color: var(--primary);
      font-size: clamp(0.6rem, 3cqi, 0.72rem);
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="habit-widget">
    <div id="habits-list"></div>

    <div class="footer-action">
      <button class="btn-reset" onclick="resetWeek()">Reiniciar semana</button>
    </div>
  </div>

  <script>
    const habitsData = [
      { id: "leer", name: "Leer 20 min", target: 5 },
      { id: "comer", name: "Comer sano", target: 6 },
      { id: "ejercicio", name: "Ejercicio", target: 5 },
      { id: "agua", name: "2 L agua", target: 7 }
    ];

    const days = ["L", "M", "X", "J", "V", "S", "D"];
    const container = document.getElementById("habits-list");

    function getStoredData() {
      const saved = localStorage.getItem("weekly_habits_tracker");
      return saved ? JSON.parse(saved) : {};
    }

    function saveState(state) {
      localStorage.setItem("weekly_habits_tracker", JSON.stringify(state));
    }

    function renderWidget() {
      const state = getStoredData();
      container.innerHTML = "";

      habitsData.forEach((habit) => {
        const habitChecked = state[habit.id] || [];
        const count = habitChecked.length;
        const percent = Math.min(100, Math.round((count / habit.target) * 100));

        const card = document.createElement("div");
        card.className = "habit-card";

        const daysHtml = days.map((day, dIdx) => {
          const isChecked = habitChecked.includes(dIdx) ? "checked" : "";
          return `
            <label class="day-label">
              <input type="checkbox" class="day-item" id="chk_${habit.id}_${dIdx}" 
                     ${isChecked} onchange="toggleDay('${habit.id}', ${dIdx})">
              <span class="day-circle">${day}</span>
            </label>
          `;
        }).join("");

        const isCompletedClass = count >= habit.target ? "completed" : "";

        card.innerHTML = `
          <div class="habit-top">
            <span class="habit-title">${habit.name}</span>
            <span class="habit-stat" id="stat_${habit.id}">${count}/${habit.target} (${percent}%)</span>
          </div>
          <div class="days-grid">${daysHtml}</div>
          <div class="progress-track">
            <div class="progress-fill ${isCompletedClass}" id="bar_${habit.id}" style="width: ${percent}%;"></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleDay(habitId, dayIndex) {
      const state = getStoredData();
      if (!state[habitId]) state[habitId] = [];

      const index = state[habitId].indexOf(dayIndex);
      if (index === -1) {
        state[habitId].push(dayIndex);
      } else {
        state[habitId].splice(index, 1);
      }

      saveState(state);

      const habit = habitsData.find(h => h.id === habitId);
      const count = state[habitId].length;
      const percent = Math.min(100, Math.round((count / habit.target) * 100));

      const bar = document.getElementById(`bar_${habitId}`);
      const stat = document.getElementById(`stat_${habitId}`);

      stat.textContent = `${count}/${habit.target} (${percent}%)`;
      bar.style.width = `${percent}%`;

      if (count >= habit.target) {
        bar.classList.add("completed");
      } else {
        bar.classList.remove("completed");
      }
    }

    function resetWeek() {
      if (confirm("¿Deseas reiniciar las casillas de toda la semana?")) {
        localStorage.removeItem("weekly_habits_tracker");
        renderWidget();
      }
    }

    renderWidget();
  </script>
</body>
</html>
