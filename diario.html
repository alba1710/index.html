<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horario Diario Notion</title>
  <style>
    :root {
      --brown-text: #735647;
      --brown-badge-bg: #f5eee8;
      --purple-border: #7e22ce;
      --text-muted: #ad9e95;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Lyon-Text", Georgia, ui-serif, Cambria, "Times New Roman", Times, serif;
    }

    body {
      background-color: transparent;
      color: var(--brown-text);
      padding: 12px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .widget-container {
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Encabezado con marco morado responsive */
    .header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1.5px solid var(--purple-border);
      padding: 6px 12px;
      border-radius: 3px;
      background: transparent;
    }

    /* Botones circulares marrones con flechas blancas */
    .nav-btn {
      background-color: var(--brown-text);
      border: none;
      color: #ffffff;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
    }

    .nav-btn svg {
      width: 10px;
      height: 10px;
      fill: #ffffff;
    }

    .nav-btn:hover {
      opacity: 0.85;
      transform: scale(1.05);
    }

    .nav-btn:active {
      transform: scale(0.95);
    }

    .date-title {
      font-size: clamp(16px, 3.8vw, 22px);
      font-weight: 700;
      color: var(--brown-text);
      text-align: center;
      flex-grow: 1;
      padding: 0 8px;
    }

    /* Lista adaptable */
    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .schedule-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 32px;
    }

    /* Fondo individual clarito para las horas */
    .time-badge {
      background-color: var(--brown-badge-bg);
      color: var(--brown-text);
      font-size: 13.5px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      min-width: 58px;
      text-align: center;
      flex-shrink: 0;
    }

    /* Entrada de texto limpia sin rayas */
    .task-col {
      display: flex;
      align-items: center;
      width: 100%;
    }

    .task-input {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      color: var(--brown-text);
      font-family: inherit;
      font-size: 14px;
      padding: 4px 6px;
    }

    .task-input::placeholder {
      color: #cfc4bb;
      font-style: italic;
    }

    /* Checkbox marrón redondeado */
    .check-col {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .custom-checkbox {
      appearance: none;
      width: 21px;
      height: 21px;
      border: 2px solid var(--brown-text);
      border-radius: 6px;
      cursor: pointer;
      outline: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .custom-checkbox:checked {
      background-color: var(--brown-text);
    }

    .custom-checkbox:checked::after {
      content: '✓';
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
      font-family: sans-serif;
    }

    .schedule-row.completed .task-input {
      text-decoration: line-through;
      color: var(--text-muted);
      opacity: 0.7;
    }

    .schedule-row.completed .time-badge {
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="header-nav">
      <button class="nav-btn" onclick="changeDay(-1)" title="Día anterior">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <div class="date-title" id="dateTitle"></div>
      <button class="nav-btn" onclick="changeDay(1)" title="Día siguiente">
        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
    </div>

    <div class="schedule-list" id="scheduleList"></div>
  </div>

  <script>
    let currentDate = new Date();
    const startHour = 8;
    const endHour = 21;

    const daysMap = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const monthsMap = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    function getDateKey(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function renderHeader() {
      const dayName = daysMap[currentDate.getDay()];
      const dayNumber = currentDate.getDate();
      const monthName = monthsMap[currentDate.getMonth()];
      document.getElementById('dateTitle').innerText = `${dayName} ${dayNumber} ${monthName}`;
    }

    function renderSchedule() {
      renderHeader();
      const listContainer = document.getElementById('scheduleList');
      listContainer.innerHTML = '';
      const dateKey = getDateKey(currentDate);

      for (let h = startHour; h <= endHour; h++) {
        const timeStr = `${h}:00`;
        const taskKey = `plan_${dateKey}_${timeStr}`;
        const checkKey = `done_${dateKey}_${timeStr}`;

        const savedText = localStorage.getItem(taskKey) || '';
        const isChecked = localStorage.getItem(checkKey) === 'true';

        const row = document.createElement('div');
        row.className = `schedule-row ${isChecked ? 'completed' : ''}`;

        row.innerHTML = `
          <div class="time-badge">${timeStr}</div>
          <div class="task-col">
            <input 
              type="text" 
              class="task-input" 
              placeholder="Añadir tarea..."
              value="${savedText}" 
              oninput="saveTask('${taskKey}', this.value)"
            />
          </div>
          <div class="check-col">
            <input 
              type="checkbox" 
              class="custom-checkbox" 
              ${isChecked ? 'checked' : ''} 
              onchange="toggleCheck('${checkKey}', this, this.parentElement.parentElement)"
            />
          </div>
        `;

        listContainer.appendChild(row);
      }
    }

    function saveTask(key, value) {
      localStorage.setItem(key, value);
    }

    function toggleCheck(key, checkbox, rowElement) {
      localStorage.setItem(key, checkbox.checked);
      if (checkbox.checked) {
        rowElement.classList.add('completed');
      } else {
        rowElement.classList.remove('completed');
      }
    }

    function changeDay(delta) {
      currentDate.setDate(currentDate.getDate() + delta);
      renderSchedule();
    }

    renderSchedule();
  </script>
</body>
</html>
