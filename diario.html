<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horario Diario Notion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --taupe-main: #937b74;
      --taupe-badge-bg: #f5efed;
      --task-text: #1a1a1a;
      --text-muted: #b8a8a3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Lora", "Lyon-Text", Georgia, ui-serif, serif;
    }

    body {
      background-color: transparent;
      color: var(--taupe-main);
      padding: 8px 6px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .widget-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    /* Encabezado compacto en una sola línea */
    .header-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 2px 0;
      width: 100%;
    }

    .nav-btn {
      background-color: var(--taupe-main);
      border: none;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
    }

    .nav-btn svg {
      width: 8px;
      height: 8px;
      fill: #ffffff;
    }

    .nav-btn:hover {
      opacity: 0.85;
      transform: scale(1.05);
    }

    .date-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--taupe-main);
      letter-spacing: 0.2px;
      text-align: center;
      white-space: nowrap;
      user-select: none;
    }

    /* Lista compacta alineada */
    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
      align-items: center;
    }

    .schedule-row {
      display: grid;
      grid-template-columns: 50px 140px 20px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 26px;
    }

    /* Fondo individual para las horas en el tono taupe suave */
    .time-badge {
      background-color: var(--taupe-badge-bg);
      color: var(--taupe-main);
      font-size: 12px;
      font-weight: 700;
      padding: 2px 0;
      border-radius: 5px;
      text-align: center;
      line-height: 1.2;
    }

    /* Campo de texto en negro */
    .task-col {
      display: flex;
      align-items: center;
    }

    .task-input {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      color: var(--task-text);
      font-family: inherit;
      font-size: 13.5px;
      padding: 2px 4px;
      line-height: 1.2;
    }

    .task-input::placeholder {
      color: #c9bdb9;
      font-style: italic;
    }

    /* Checkbox en el tono exacto de la paleta */
    .check-col {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .custom-checkbox {
      appearance: none;
      width: 17px;
      height: 17px;
      border: 1.5px solid var(--taupe-main);
      border-radius: 4px;
      cursor: pointer;
      outline: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .custom-checkbox:checked {
      background-color: var(--taupe-main);
      border-color: var(--taupe-main);
    }

    .custom-checkbox:checked::after {
      content: '✓';
      color: #ffffff;
      font-size: 10px;
      font-weight: bold;
      font-family: sans-serif;
    }

    .schedule-row.completed .task-input {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .schedule-row.completed .time-badge {
      opacity: 0.55;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="header-nav">
      <button class="nav-btn" onclick="changeDay(-1)" title="Día anterior">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <div class="date-title" id="dateTitle"></div>
      <button class="nav-btn" onclick="changeDay(1)" title="Día siguiente">
        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
    </div>

    <div class="schedule-list" id="scheduleList"></div>
  </div>

  <script>
    let currentDate = new Date();
    const startHour = 8;
    const endHour = 21;

    const daysMap = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const monthsMap = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    function getDateKey(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function renderHeader() {
      const dayName = daysMap[currentDate.getDay()];
      const dayNumber = currentDate.getDate();
      const monthName = monthsMap[currentDate.getMonth()];
      document.getElementById('dateTitle').innerText = `${dayName} ${dayNumber} ${monthName}`;
    }

    function renderSchedule() {
      renderHeader();
      const listContainer = document.getElementById('scheduleList');
      listContainer.innerHTML = '';
      const dateKey = getDateKey(currentDate);

      for (let h = startHour; h <= endHour; h++) {
        const timeStr = `${h}:00`;
        const taskKey = `plan_${dateKey}_${timeStr}`;
        const checkKey = `done_${dateKey}_${timeStr}`;

        const savedText = localStorage.getItem(taskKey) || '';
        const isChecked = localStorage.getItem(checkKey) === 'true';

        const row = document.createElement('div');
        row.className = `schedule-row ${isChecked ? 'completed' : ''}`;

        row.innerHTML = `
          <div class="time-badge">${timeStr}</div>
          <div class="task-col">
            <input 
              type="text" 
              class="task-input" 
              placeholder="Tarea..."
              value="${savedText}" 
              oninput="saveTask('${taskKey}', this.value)"
            />
          </div>
          <div class="check-col">
            <input 
              type="checkbox" 
              class="custom-checkbox" 
              ${isChecked ? 'checked' : ''} 
              onchange="toggleCheck('${checkKey}', this, this.parentElement.parentElement)"
            />
          </div>
        `;

        listContainer.appendChild(row);
      }
    }

    function saveTask(key, value) {
      localStorage.setItem(key, value);
    }

    function toggleCheck(key, checkbox, rowElement) {
      localStorage.setItem(key, checkbox.checked);
      if (checkbox.checked) {
        rowElement.classList.add('completed');
      } else {
        rowElement.classList.remove('completed');
      }
    }

    function changeDay(delta) {
      currentDate.setDate(currentDate.getDate() + delta);
      renderSchedule();
    }

    renderSchedule();
  </script>
</body>
</html>
