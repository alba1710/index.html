<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Widget Notion</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-brown-header: #bb988f; /* Nuevo color principal */
      --color-numbers: #bb988f;      /* Color de los números */
      --color-muted: #ded1cd;        /* Días fuera del mes actual */
      --color-bg: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      user-select: none;
    }

    body {
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .calendar-container {
      width: 280px;
      background: var(--color-bg);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .header {
      background-color: var(--color-brown-header);
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
    }

    .header .title {
      font-size: 1.05rem;
      font-weight: 700;
      text-transform: capitalize;
    }

    .nav-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    .nav-btn:hover {
      opacity: 1;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      padding: 16px 12px 6px;
      font-weight: 700;
      font-size: 0.85rem;
      color: #2b2b2b;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 6px 12px 18px;
      text-align: center;
    }

    .day {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 32px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-numbers);
      border-radius: 8px;
    }

    .day.other-month {
      color: var(--color-muted);
    }

    .day.today {
      background-color: var(--color-brown-header);
      color: #ffffff !important;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(187, 152, 143, 0.4);
    }
  </style>
</head>
<body>

  <div class="calendar-container">
    <div class="header">
      <button class="nav-btn" id="prev">&#10094;</button>
      <span class="title" id="month-year"></span>
      <button class="nav-btn" id="next">&#10095;</button>
    </div>

    <div class="weekdays">
      <span>L</span>
      <span>M</span>
      <span>X</span>
      <span>J</span>
      <span>V</span>
      <span>S</span>
      <span>D</span>
    </div>

    <div class="days" id="calendar-days"></div>
  </div>

  <script>
    const monthNames = [
      "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
      "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
    ];

    let currentDate = new Date();

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const title = document.getElementById("month-year");
      const daysContainer = document.getElementById("calendar-days");

      title.innerText = `${monthNames[month]} ${year}`;
      daysContainer.innerHTML = "";

      const firstDay = new Date(year, month, 1).getDay();
      const startingDay = (firstDay + 6) % 7;

      const totalDays = new Date(year, month + 1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();

      for (let i = startingDay - 1; i >= 0; i--) {
        const dayDiv = document.createElement("div");
        dayDiv.classList.add("day", "other-month");
        dayDiv.innerText = prevMonthDays - i;
        daysContainer.appendChild(dayDiv);
      }

      const realToday = new Date();
      for (let i = 1; i <= totalDays; i++) {
        const dayDiv = document.createElement("div");
        dayDiv.classList.add("day");

        if (
          i === realToday.getDate() &&
          month === realToday.getMonth() &&
          year === realToday.getFullYear()
        ) {
          dayDiv.classList.add("today");
        }

        dayDiv.innerText = i;
        daysContainer.appendChild(dayDiv);
      }

      const totalRendered = startingDay + totalDays;
      const nextDaysCount = (7 - (totalRendered % 7)) % 7;

      for (let i = 1; i <= nextDaysCount; i++) {
        const dayDiv = document.createElement("div");
        dayDiv.classList.add("day", "other-month");
        dayDiv.innerText = i;
        daysContainer.appendChild(dayDiv);
      }
    }

    document.getElementById("prev").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById("next").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
